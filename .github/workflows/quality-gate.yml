name: BVDK quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, regression and DB contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify database schema contract
        run: npm run db:schema:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Security checks
        run: npm run test:security

      - name: Regression checks
        run: npm run validate:all

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: --max-old-space-size=4096


  docker-image:
    name: Build and publish Docker image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check public configuration
        env:
          TURNSTILE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$TURNSTILE_KEY" ]; then
            echo "::error::Missing NEXT_PUBLIC_TURNSTILE_SITE_KEY"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/leean1707/bvdkthoilai:sha-${{ github.sha }}
            ghcr.io/leean1707/bvdkthoilai:main
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://bvdkthoilai.vn
            NEXT_PUBLIC_MEDPRO_URL=${{ vars.NEXT_PUBLIC_MEDPRO_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_HOTLINE=${{ vars.NEXT_PUBLIC_HOTLINE }}
            NEXT_PUBLIC_ZALO_URL=${{ vars.NEXT_PUBLIC_ZALO_URL }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
