name: BVDK production deployment

on:
  workflow_run:
    workflows: ["BVDK quality gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: bvdk-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved GHCR image to Vietnix VPS
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://bvdkthoilai.vn
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid source SHA'; exit 1; }
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]] || { echo 'VPS_HOST missing/invalid'; exit 1; }
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'VPS_SSH_PORT invalid'; exit 1; }
          (( 10#$VPS_SSH_PORT >= 1 && 10#$VPS_SSH_PORT <= 65535 )) || { echo 'VPS_SSH_PORT out of range'; exit 1; }
          [[ -n "$VPS_SSH_PRIVATE_KEY" && -n "$VPS_SSH_KNOWN_HOSTS" ]] || {
            echo 'Production SSH secrets not configured'; exit 1;
          }
          echo "Approved source commit: $TARGET_SHA"

      - name: Deploy using restricted SSH command
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          key_file="$RUNNER_TEMP/bvdk-deploy-key"
          known_hosts_file="$RUNNER_TEMP/bvdk-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh \
            -F /dev/null \
            -i "$key_file" \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "bvdkdeploy@$VPS_HOST" "deploy $TARGET_SHA"
