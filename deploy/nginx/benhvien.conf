# v4.3.0 - Nginx reverse proxy / anti-spam baseline
# SSL certificate directives are normally managed by Certbot.
limit_req_zone $binary_remote_addr zone=site_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=site_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=site_forms:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=site_chatbot:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

server {
    listen 80;
    server_name benhvienthoilai.vn www.benhvienthoilai.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name benhvienthoilai.vn www.benhvienthoilai.vn;

    # ssl_certificate /etc/letsencrypt/live/benhvienthoilai.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/benhvienthoilai.vn/privkey.pem;

    server_tokens off;
    client_max_body_size 55m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn per_ip 30;

    # Never pass secrets/source-control/backups to Node.
    location ~* ^/(?:\.env|\.git|\.svn|\.hg)(?:/|$) { return 404; }
    location ~* \.(?:sql|dump|bak|backup|old|orig|swp)$ { return 404; }
    location ~* ^/(?:wp-admin|wp-login\.php|phpmyadmin|pma)(?:/|$) { return 404; }

    location = /api/users/login {
        limit_req zone=site_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/bv-proxy.conf;
    }
    location ~ ^/api/(appointments|feedback|forms|surveys/submit|consultation|document-access) {
        limit_req zone=site_forms burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/bv-proxy.conf;
    }
    location = /api/chatbot {
        limit_req zone=site_chatbot burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/bv-proxy.conf;
    }
    location / {
        limit_req zone=site_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/bv-proxy.conf;
    }
}
